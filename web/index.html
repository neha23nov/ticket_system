<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ================================================================== -->
    <!-- Navigation Bar (visible only when logged in)                       -->
    <!-- ================================================================== -->
    <nav id="navbar" class="navbar hidden">
        <div class="nav-brand">🎫 Ticket System</div>
        <div class="nav-links">
            <span id="nav-username" class="nav-user"></span>
            <button onclick="showDashboard()" class="nav-btn">My Tickets</button>
            <button onclick="showCreateTicket()" class="nav-btn nav-btn-primary">+ New Ticket</button>
            <button onclick="logout()" class="nav-btn nav-btn-danger">Logout</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app">

        <!-- ============================================================== -->
        <!-- AUTH PAGE: Login & Register                                    -->
        <!-- ============================================================== -->
        <div id="auth-page" class="page">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>🎫 Ticket System</h1>
                    <p>Manage your support tickets with ease</p>
                </div>

                <!-- Tab Switcher -->
                <div class="auth-tabs">
                    <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                    <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                </form>

                <!-- Error/Success Messages -->
                <div id="auth-message" class="message hidden"></div>
            </div>
        </div>

        <!-- ============================================================== -->
        <!-- DASHBOARD PAGE: Ticket List                                    -->
        <!-- ============================================================== -->
        <div id="dashboard-page" class="page hidden">
            <div class="container">
                <div class="page-header">
                    <h2>My Tickets</h2>
                    <button onclick="showCreateTicket()" class="btn btn-primary">+ New Ticket</button>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all" onclick="filterTickets('all', this)">All</button>
                    <button class="filter-tab" data-filter="open" onclick="filterTickets('open', this)">Open</button>
                    <button class="filter-tab" data-filter="in_progress" onclick="filterTickets('in_progress', this)">In Progress</button>
                    <button class="filter-tab" data-filter="closed" onclick="filterTickets('closed', this)">Closed</button>
                </div>

                <!-- Ticket List -->
                <div id="ticket-list" class="ticket-list">
                    <!-- Tickets will be rendered here by JavaScript -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon">📭</div>
                    <h3>No tickets yet</h3>
                    <p>Create your first ticket to get started!</p>
                    <button onclick="showCreateTicket()" class="btn btn-primary">Create Ticket</button>
                </div>
            </div>
        </div>

        <!-- ============================================================== -->
        <!-- CREATE TICKET PAGE                                             -->
        <!-- ============================================================== -->
        <div id="create-page" class="page hidden">
            <div class="container container-sm">
                <div class="page-header">
                    <h2>Create New Ticket</h2>
                </div>
                <form onsubmit="handleCreateTicket(event)" class="card">
                    <div class="form-group">
                        <label for="ticket-title">Title</label>
                        <input type="text" id="ticket-title" placeholder="Brief summary of the issue" required>
                    </div>
                    <div class="form-group">
                        <label for="ticket-desc">Description</label>
                        <textarea id="ticket-desc" rows="5" placeholder="Describe the issue in detail..." required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="showDashboard()" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Ticket</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============================================================== -->
        <!-- TICKET DETAIL PAGE                                             -->
        <!-- ============================================================== -->
        <div id="detail-page" class="page hidden">
            <div class="container container-sm">
                <button onclick="showDashboard()" class="back-link">← Back to Tickets</button>
                <div class="card" id="ticket-detail">
                    <!-- Ticket detail will be rendered here by JavaScript -->
                </div>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js"></script>
</body>
</html>
